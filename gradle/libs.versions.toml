checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3Session" }
cronet = { group = "org.chromium.net", name = "cronet", version.ref = "cronet" }
media3-datasource-cronet = { group = "androidx.media3", name = "media3-datasource-cronet", version.ref = "media3DatasourceCronet" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

